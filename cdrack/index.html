<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CD Rack</title>
<style>
:root{--bg:#16120e;--wood1:#7a5532;--wood2:#4b3220;--ink:#f4ede4;--muted:#b9ab9a;--accent:#e8b04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:110px}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#16120e;box-shadow:0 8px 12px -6px rgba(0,0,0,.8);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
h1{margin:0 0 8px;font-size:22px;letter-spacing:7px;font-weight:800}
h1 small{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:500;margin-left:6px}
.row{display:flex;gap:8px;align-items:center}
.tabs button,.chip{background:#2a231c;border:1px solid #3b3128;border-radius:20px;padding:8px 14px;font-size:14px}
.tabs button.on{background:var(--ink);color:#16120e;border-color:var(--ink);font-weight:700}
.search{flex:1;min-width:0;background:#2a231c;border:1px solid #3b3128;border-radius:20px;padding:9px 14px;color:var(--ink);font-size:15px;outline:none}
.icon{background:none;border:none;font-size:20px;padding:6px 8px;cursor:pointer}
.az{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.az::-webkit-scrollbar{display:none}
.az a{flex:0 0 auto;color:var(--muted);text-decoration:none;font-size:13px;padding:4px 6px;font-weight:700}
.rack{padding:4px 0 10px}
.shelf{margin:22px 0 0;position:relative}
.shelf .lbl{position:absolute;left:12px;top:-18px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:2px}
.spines{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:22px 14px 0;height:206px;scrollbar-width:none;scroll-snap-type:x proximity}
.spines::-webkit-scrollbar{display:none}
.plank{height:14px;margin:0 6px;background:linear-gradient(var(--wood1),var(--wood2));border-radius:2px;box-shadow:0 6px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.spine{flex:0 0 auto;height:178px;border:none;border-radius:2px;padding:6px 0;cursor:pointer;position:relative;
  writing-mode:vertical-rl;text-orientation:mixed;font-size:11.5px;line-height:1.15;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  box-shadow:inset 2px 0 0 rgba(255,255,255,.25),inset -2px 0 0 rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.5);transition:transform .25s ease;scroll-snap-align:start}
.spine:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,0) 35%,rgba(0,0,0,.15));pointer-events:none}
.spine b{font-weight:800;letter-spacing:.8px}
.spine.out{transform:translateY(-20px);outline:2px solid var(--accent);outline-offset:1px}
.spine.out:before{content:"▶ ";color:var(--accent)}
.empty{margin:30px 16px;color:var(--muted);line-height:1.5}
/* mini player */
.mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;background:#2a231c;border:1px solid #3b3128;border-radius:14px;
  display:flex;align-items:center;gap:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.mini img,.mini .ph{width:52px;height:52px;border-radius:6px;flex:0 0 auto;object-fit:cover}
.mini .txt{flex:1;min-width:0;cursor:pointer}
.mini .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{height:3px;background:#3b3128;border-radius:2px;margin-top:5px;overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--accent);width:0}
.ctl{background:none;border:none;font-size:22px;padding:6px;cursor:pointer;line-height:1}
.ctl.big{font-size:26px}
.ph{background:#3b3128;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted)}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#211b15;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.case{display:flex;gap:14px;align-items:flex-start}
.case .cover{width:42%;max-width:220px;aspect-ratio:1;border-radius:4px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.6);flex:0 0 auto}
.case h2{margin:2px 0 4px;font-size:20px;line-height:1.2}
.case .by{color:var(--muted);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.btn{border:none;border-radius:24px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;background:#3b3128;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);color:#16120e}
.tracks{list-style:none;padding:0;margin:10px 0 0}
.tracks li{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #332a22;cursor:pointer}
.tracks .n{width:22px;color:var(--muted);font-size:13px;text-align:right}
.tracks .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks .d{color:var(--muted);font-size:13px}
.tracks li.now .nm{color:var(--accent);font-weight:700}
.dev{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #332a22}
/* setup */
.setup{padding:20px 18px;max-width:560px;margin:0 auto;line-height:1.5}
.setup input{width:100%;padding:12px;border-radius:10px;border:1px solid #3b3128;background:#2a231c;color:var(--ink);font-size:15px}
.setup code{background:#2a231c;padding:2px 6px;border-radius:6px;word-break:break-all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#16120e;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
.loading{text-align:center;color:var(--muted);margin:40px}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script>
"use strict";
/* ======================================================================
   CD Rack (phone edition)
   A single page: log in with Spotify (PKCE, no server, no secret),
   your saved albums and playlists become CDs on shelves, tap one to
   open the case and play it on your phone's Spotify app.
   Host on any HTTPS static host (e.g. GitHub Pages). Add ?demo=1 to try with fake data.
   ====================================================================== */

const REDIRECT = location.origin + location.pathname;
const SCOPES = "user-library-read playlist-read-private playlist-read-collaborative user-read-currently-playing user-read-playback-state user-modify-playback-state";
const API = "https://api.spotify.com/v1";
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem("cdrack_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cdrack_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("cdrack_" + k); } catch {} }
};
const S = {
  demo: new URLSearchParams(location.search).has("demo") || LS.get("demo", false),
  clientId: LS.get("clientId", ""),
  tab: LS.get("tab", "albums"),
  filter: "",
  albums: [], playlists: [],
  player: null,
  device: LS.get("device", null),
  scrolledToNow: false
};

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const $ = (s) => document.querySelector(s);
function toast(msg, ms = 2600) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast" }, msg); document.body.append(t);
  setTimeout(() => t.remove(), ms);
}
const mmss = ms => ms == null ? "" : `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
const sortKey = s => (s || "").toLowerCase().replace(/^the /, "");
function pickImg(images, target) {
  const imgs = (images || []).filter(i => i && i.url).sort((a, b) => (a.width || 0) - (b.width || 0));
  if (!imgs.length) return null;
  return (imgs.find(i => (i.width || 0) >= target) || imgs[imgs.length - 1]).url;
}
function hash(s) { let x = 2166136261; for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
function initials(s) { return (s || "?").split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase(); }
function art(url, name, cls) { return url ? h("img", { src: url, alt: "", class: cls || "", loading: "lazy" }) : h("div", { class: "ph " + (cls || "") }, initials(name)); }
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

/* ---------- auth (Authorization Code + PKCE) ---------- */
const Auth = {
  tok: LS.get("tok", null),
  connected() { return !!(this.tok && this.tok.refresh_token); },
  async login() {
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    LS.set("pkce", { verifier, state });
    const q = new URLSearchParams({ client_id: S.clientId, response_type: "code", redirect_uri: REDIRECT, scope: SCOPES,
      state, code_challenge_method: "S256", code_challenge: challenge });
    location.href = "https://accounts.spotify.com/authorize?" + q;
  },
  async handleRedirect() {
    const q = new URLSearchParams(location.search);
    if (!q.has("code") && !q.has("error")) return false;
    history.replaceState(null, "", location.pathname);
    if (q.get("error")) throw new Error("Spotify login cancelled: " + q.get("error"));
    const p = LS.get("pkce");
    if (!p || p.state !== q.get("state")) throw new Error("Login link expired. Tap Connect again.");
    await this._token({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT,
      client_id: S.clientId, code_verifier: p.verifier });
    LS.del("pkce");
    return true;
  },
  async _token(body) {
    const r = await fetch("https://accounts.spotify.com/api/token", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (body.grant_type === "refresh_token") { this.logout(); }
      throw new Error("Spotify login failed: " + (j.error_description || j.error || r.status));
    }
    j.expires_at = Date.now() + (j.expires_in || 3600) * 1000;
    j.refresh_token = j.refresh_token || (this.tok && this.tok.refresh_token);
    this.tok = j; LS.set("tok", j);
  },
  _refreshing: null,
  async access(force) {
    if (!this.connected()) return null;
    if (force || Date.now() > this.tok.expires_at - 60000) {
      this._refreshing = this._refreshing || this._token({ grant_type: "refresh_token", refresh_token: this.tok.refresh_token, client_id: S.clientId })
        .finally(() => { this._refreshing = null; });
      await this._refreshing;
    }
    return this.tok.access_token;
  },
  logout() { this.tok = null; LS.del("tok"); LS.del("lib"); }
};

class SpotifyError extends Error { constructor(status, reason, msg) { super(msg); this.status = status; this.reason = reason; } }

async function api(method, path, { params, body } = {}, retry = true) {
  const token = await Auth.access();
  if (!token) throw new SpotifyError(401, "NO_TOKEN", "Not connected");
  let url = path.startsWith("http") ? path : API + path;
  if (params) url += (url.includes("?") ? "&" : "?") + new URLSearchParams(params);
  const r = await fetch(url, { method, headers: { Authorization: "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && retry) { await Auth.access(true); return api(method, path, { params, body }, false); }
  if (r.status === 429 && retry) { await new Promise(res => setTimeout(res, Math.min(+(r.headers.get("Retry-After") || 2), 10) * 1000)); return api(method, path, { params, body }, false); }
  const text = await r.text();
  let j = null; try { j = text ? JSON.parse(text) : null; } catch {}
  if (!r.ok) {
    const e = (j && j.error) || {};
    throw new SpotifyError(r.status, e.reason || "", e.message || text.slice(0, 200) || ("HTTP " + r.status));
  }
  return j;
}
async function paginate(path, params) {
  const out = []; let url = path, p = params;
  while (url) { const pg = await api("GET", url, { params: p }); out.push(...(pg.items || [])); url = pg.next; p = null; }
  return out;
}

/* ---------- data sources ---------- */
const Real = {
  async library() {
    const albums = (await paginate("/me/albums", { limit: 50 })).map(it => it.album).filter(a => a && a.id).map(a => ({
      kind: "album", id: a.id, uri: a.uri, name: a.name || "?",
      artist: (a.artists || []).map(x => x.name).join(", "), year: (a.release_date || "").slice(0, 4),
      count: (a.tracks && a.tracks.total) || a.total_tracks || 0, img: pickImg(a.images, 300)
    })).sort((x, y) => sortKey(x.artist).localeCompare(sortKey(y.artist)) || x.year.localeCompare(y.year) || x.name.localeCompare(y.name));
    const playlists = (await paginate("/me/playlists", { limit: 50 })).filter(p => p && p.id).map(p => ({
      kind: "playlist", id: p.id, uri: p.uri, name: p.name || "?",
      artist: (p.owner && p.owner.display_name) || "Mixtape", year: "",
      count: ((p.tracks || p.items || {}).total) || 0, img: pickImg(p.images, 300)
    })).sort((x, y) => x.name.localeCompare(y.name));
    return { albums, playlists };
  },
  async player() {
    const p = await api("GET", "/me/player");
    if (!p || !p.item) return p ? { is_playing: p.is_playing, device: p.device } : null;
    const al = p.item.album || {};
    return { is_playing: p.is_playing, device: p.device, context: p.context && p.context.uri,
      track: p.item.name, trackUri: p.item.uri, artist: (p.item.artists || []).map(a => a.name).join(", "),
      album: al.name, albumId: al.id, albumUri: al.uri, img: pickImg(al.images, 64),
      progress: p.progress_ms, duration: p.item.duration_ms, at: Date.now() };
  },
  async detail(item) {
    if (item.kind === "album") {
      const a = await api("GET", "/albums/" + encodeURIComponent(item.id));
      return { ...item, img: pickImg(a.images, 640) || item.img,
        tracks: ((a.tracks && a.tracks.items) || []).map((t, i) => ({ n: t.track_number || i + 1, name: t.name, dur: t.duration_ms, uri: t.uri })) };
    }
    let tracks = [];
    try {
      const items = (await api("GET", `/playlists/${encodeURIComponent(item.id)}/items`, { params: { limit: 50 } })).items || [];
      tracks = items.map((it, i) => { const t = it.item || it.track || {}; return { n: i + 1, name: t.name, dur: t.duration_ms, uri: t.uri }; }).filter(t => t.name);
    } catch (e) { /* Spotify only lists tracks for playlists you own or collaborate on */ }
    return { ...item, tracks };
  },
  async devices() { return ((await api("GET", "/me/player/devices")) || {}).devices || []; },
  async play(uri, offset, shuffle, deviceId) {
    const params = deviceId ? { device_id: deviceId } : undefined;
    try { await api("PUT", "/me/player/shuffle", { params: { state: shuffle ? "true" : "false", ...(params || {}) } }); }
    catch (e) { if (e.status === 404) throw e; }
    const body = { context_uri: uri };
    if (offset != null) body.offset = { position: +offset };
    await api("PUT", "/me/player/play", { params, body });
  },
  async control(action) {
    if (action === "pause") return api("PUT", "/me/player/pause");
    if (action === "resume") return api("PUT", "/me/player/play");
    if (action === "next") return api("POST", "/me/player/next");
    if (action === "prev") return api("POST", "/me/player/previous");
  }
};

const Demo = (() => {
  const ARTISTS = ["Arctic Monkeys","Björk","The Beatles","Blur","Coldplay","Daft Punk","Elbow","Fleetwood Mac","Gorillaz","The Verve","Massive Attack","Oasis","Portishead","Pulp","Radiohead","The Smiths","The Stone Roses","Suede","Kate Bush","Joy Division","New Order","Doves","Pink Floyd","Prince","Amy Winehouse","Bon Iver","Wet Leg","Fontaines D.C.","IDLES","The Cure","Talking Heads","Lana Del Rey","Keane","Hozier","Inhaler","Jamie T"];
  const W = ["Blue","Night","Signal","Paper","Summer","Static","Ghost","Northern","Echo","Glass","Satellite","Velvet","Harbour","Neon","Quiet","Engine","Rain","Gold"];
  let seed = 11; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; const pick = a => a[Math.floor(r() * a.length)];
  const albums = Array.from({ length: 90 }, (_, i) => {
    const n = pick([9, 10, 11, 12, 13, 26]);
    return { kind: "album", id: "a" + i, uri: "spotify:album:a" + i, name: pick(W) + " " + pick(W), artist: pick(ARTISTS),
      year: String(1969 + Math.floor(r() * 56)), count: n, img: null,
      tracks: Array.from({ length: n }, (_, k) => ({ n: k + 1, name: pick(W) + " " + pick(W), dur: (140 + Math.floor(r() * 190)) * 1000 })) };
  }).sort((x, y) => sortKey(x.artist).localeCompare(sortKey(y.artist)) || x.year.localeCompare(y.year));
  const playlists = ["Road Trip","Sunday Morning","Kitchen Disco","Running","Focus","Hot Tub Classics","Poker Night","Kids' Car Songs"].map((n, i) => ({
    kind: "playlist", id: "p" + i, uri: "spotify:playlist:p" + i, name: n, artist: "You", year: "", count: 12, img: null,
    tracks: Array.from({ length: 12 }, (_, k) => ({ n: k + 1, name: pick(W) + " " + pick(W), dur: 200000 })) }));
  const st = { item: albums[40], t: 2, playing: true, started: Date.now() - 50000 };
  const all = () => albums.concat(playlists);
  return {
    async library() { return { albums, playlists }; },
    async player() {
      const a = st.item, t = a.tracks[st.t];
      return { is_playing: st.playing, device: { name: "This phone", type: "Smartphone" }, context: a.uri, track: t.name, trackUri: a.id + ":" + st.t,
        artist: a.kind === "album" ? a.artist : "Various", album: a.name, albumId: a.kind === "album" ? a.id : null, img: null,
        progress: st.playing ? Math.min(Date.now() - st.started, t.dur) : 60000, duration: t.dur, at: Date.now() };
    },
    async detail(item) { return all().find(x => x.id === item.id); },
    async devices() { return [{ id: "d1", name: "This phone", type: "Smartphone", is_active: true }]; },
    async play(uri, offset, shuffle) { st.item = all().find(x => x.uri === uri); st.t = +(offset || (shuffle ? Math.floor(Math.random() * st.item.tracks.length) : 0)); st.playing = true; st.started = Date.now(); },
    async control(a) {
      const n = st.item.tracks.length;
      if (a === "pause") st.playing = false; if (a === "resume") st.playing = true;
      if (a === "next") { st.t = (st.t + 1) % n; st.started = Date.now(); } if (a === "prev") { st.t = (st.t - 1 + n) % n; st.started = Date.now(); }
    }
  };
})();
const Src = () => S.demo ? Demo : Real;

/* ---------- rendering ---------- */
const SPINE_COLOURS = [
  ["#f2ece1", "#1a1a1a"], ["#111", "#f2ece1"], ["#b3261e", "#fff"], ["#1f3a5f", "#f2ece1"], ["#e8b04a", "#1a1a1a"],
  ["#2f5d50", "#f2ece1"], ["#6d597a", "#fff"], ["#d9d4c7", "#7a1f1f"], ["#3d3d3d", "#e8b04a"], ["#c66b3d", "#fff"],
  ["#8fb3c9", "#111"], ["#5b4636", "#f2ece1"]
];
function spine(item) {
  const x = hash(item.id), [bg, fg] = SPINE_COLOURS[x % SPINE_COLOURS.length];
  let w = 26 + (x >> 5) % 10; if (item.count > 22) w += 14;   // double albums are fatter
  const label = item.kind === "playlist" ? item.name : item.artist;
  const sub = item.kind === "playlist" ? "mixtape" : item.name;
  const el = h("button", { class: "spine", style: `width:${w}px;background:${bg};color:${fg}`, "data-uri": item.uri,
    title: `${item.artist} - ${item.name}`, onclick: () => openCase(item) },
    h("b", null, label.toUpperCase()), "  ·  ", sub);
  return el;
}
function groupKey(item) {
  const c = sortKey(S.tab === "playlists" ? item.name : item.artist).charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : "#";
}
function currentItems() {
  const items = S.tab === "playlists" ? S.playlists : S.albums;
  const f = S.filter.trim().toLowerCase();
  return f ? items.filter(i => (i.name + " " + i.artist).toLowerCase().includes(f)) : items;
}
function renderRack() {
  const rack = $("#rack"); if (!rack) return;
  rack.textContent = "";
  const items = currentItems();
  const groups = new Map();
  for (const it of items) { const k = groupKey(it); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  const az = $("#az"); az.textContent = "";
  for (const [k, list] of groups) {
    az.append(h("a", { href: "#shelf-" + k, onclick: (e) => { e.preventDefault(); document.getElementById("shelf-" + k).scrollIntoView({ behavior: "smooth", block: "center" }); } }, k));
    rack.append(h("div", { class: "shelf", id: "shelf-" + k }, h("div", { class: "lbl" }, k), h("div", { class: "spines" }, list.map(spine)), h("div", { class: "plank" })));
  }
  if (!items.length) rack.append(h("div", { class: "empty" }, S.filter ? "No CDs match that search." :
    S.tab === "playlists" ? "No playlists yet." : "Your rack is empty. Save some albums in Spotify (tap + on an album page), then pull down the menu and tap Reload."));
  markPlaying();
}
function markPlaying() {
  document.querySelectorAll(".spine.out").forEach(s => s.classList.remove("out"));
  const p = S.player; if (!p || !p.context) return;
  const el = document.querySelector(`.spine[data-uri="${CSS.escape(p.context)}"]`);
  if (el) {
    el.classList.add("out");
    if (!S.scrolledToNow) { S.scrolledToNow = true; el.scrollIntoView({ block: "center", inline: "center" }); }
  }
}
function renderMini() {
  const m = $("#mini"); if (!m) return;
  const p = S.player; m.textContent = "";
  if (!p || !p.track) {
    m.append(h("div", { class: "ph", style: "width:52px;height:52px;border-radius:6px" }, "♪"),
      h("div", { class: "txt" }, h("div", { class: "t" }, "Nothing playing"), h("div", { class: "s" }, "Tap a CD to put it on")));
    return;
  }
  const pct = p.duration ? Math.min(100, (p.progress / p.duration) * 100) : 0;
  const item = findItem(p.context) || findItem(p.albumUri);
  m.append(art(p.img, p.album),
    h("div", { class: "txt", onclick: () => item && openCase(item) },
      h("div", { class: "t" }, p.track), h("div", { class: "s" }, `${p.artist} · ${p.album}`),
      h("div", { class: "bar" }, h("i", { style: `width:${pct}%` }))),
    h("button", { class: "ctl", "aria-label": "Previous", onclick: () => control("prev") }, "⏮"),
    h("button", { class: "ctl big", "aria-label": p.is_playing ? "Pause" : "Play", onclick: () => control(p.is_playing ? "pause" : "resume") }, p.is_playing ? "⏸" : "▶"),
    h("button", { class: "ctl", "aria-label": "Next", onclick: () => control("next") }, "⏭"));
}
function findItem(uri) { return uri ? S.albums.concat(S.playlists).find(x => x.uri === uri) : null; }

function sheet(content) {
  closeSheet();
  const v = h("div", { class: "veil", id: "veil", onclick: (e) => { if (e.target.id === "veil") closeSheet(); } }, h("div", { class: "sheet" }, content));
  document.body.append(v);
  return v;
}
function closeSheet() { const v = $("#veil"); if (v) v.remove(); }

async function openCase(item) {
  const box = h("div", null, h("div", { class: "loading" }, "Opening the case…"));
  sheet(box);
  let d;
  try { d = await Src().detail(item); } catch (e) { box.textContent = ""; box.append(h("p", null, errText(e))); return; }
  box.textContent = "";
  const openUrl = `https://open.spotify.com/${d.kind}/${d.id}`;
  box.append(...[
    h("div", { class: "case" }, art(d.img, d.name, "cover"),
      h("div", null, h("h2", null, d.name), h("div", { class: "by" }, d.artist + (d.year ? " · " + d.year : "")),
        h("div", { class: "by", style: "margin-top:4px" }, d.kind === "playlist" ? "Mixtape" : `${(d.tracks || []).length || d.count} tracks`))),
    h("div", { class: "btns" },
      h("button", { class: "btn primary", onclick: () => play(d.uri, null, false) }, "▶  Play CD"),
      h("button", { class: "btn", onclick: () => play(d.uri, null, true) }, "⇄  Shuffle"),
      S.demo ? null : h("a", { class: "btn", href: openUrl, target: "_blank", rel: "noopener" }, "Open in Spotify")),
    h("ol", { class: "tracks" }, (d.tracks || []).map((t, i) =>
      h("li", { class: S.player && S.player.context === d.uri && S.player.track === t.name ? "now" : "", onclick: () => play(d.uri, i, false) },
        h("span", { class: "n" }, t.n), h("span", { class: "nm" }, t.name), h("span", { class: "d" }, mmss(t.dur))))),
    d.kind === "playlist" && !(d.tracks || []).length ? h("p", { class: "by" }, "Spotify only shows track lists for playlists you made, but Play still works.") : null
  ].filter(Boolean));
}

function errText(e) {
  if (e.status === 403) return "Spotify refused. Playback control needs Premium, and your account must be allowed on your developer app (User Management).";
  if (e.status === 401) return "Your Spotify login has expired. Open the menu and tap Reconnect.";
  return e.message || String(e);
}

async function play(uri, offset, shuffle, deviceId) {
  try {
    await Src().play(uri, offset, shuffle, deviceId || S.device || undefined);
    closeSheet(); toast(shuffle ? "Shuffling…" : "Putting it on…", 1500);
    setTimeout(refreshPlayer, 900); setTimeout(refreshPlayer, 2500);
  } catch (e) {
    if (e.status === 404) {
      if (S.device && !deviceId) { S.device = null; LS.del("device"); }
      return chooseDevice(uri, offset, shuffle);
    }
    toast(errText(e), 5000);
  }
}
async function chooseDevice(uri, offset, shuffle) {
  let devs = [];
  try { devs = await Src().devices(); } catch (e) { return toast(errText(e), 5000); }
  if (devs.length === 1) { S.device = devs[0].id; LS.set("device", S.device); return play(uri, offset, shuffle, devs[0].id); }
  const id = (uri || "").split(":");
  const openUrl = id.length === 3 ? `https://open.spotify.com/${id[1]}/${id[2]}` : "https://open.spotify.com/";
  sheet(h("div", null,
    h("h2", { style: "margin-top:0" }, devs.length ? "Play it where?" : "Wake up Spotify first"),
    devs.length ? devs.map(d => h("div", { class: "dev" }, h("div", null, h("b", null, d.name), h("div", { class: "by" }, d.type)),
        h("button", { class: "btn primary", onclick: () => { S.device = d.id; LS.set("device", d.id); play(uri, offset, shuffle, d.id); } }, "Play here")))
      : h("p", { class: "by" }, "Spotify can only take orders from an app that's awake. Tap below to open Spotify, then come back here and tap Try again."),
    h("div", { class: "btns" },
      h("a", { class: "btn", href: openUrl, target: "_blank", rel: "noopener" }, "Open Spotify"),
      h("button", { class: "btn primary", onclick: () => play(uri, offset, shuffle) }, "Try again"),
      h("button", { class: "btn", onclick: closeSheet }, "Cancel"))));
}
async function control(action) {
  try {
    await Src().control(action);
    if (S.player && (action === "pause" || action === "resume")) { S.player.is_playing = action === "resume"; renderMini(); }
    setTimeout(refreshPlayer, 700);
  } catch (e) {
    if (e.status === 404) toast("No active Spotify device. Tap a CD to start one.", 4000);
    else toast(errText(e), 5000);
  }
}
async function refreshPlayer() {
  try { S.player = await Src().player(); } catch (e) { if (e.status === 401 && !Auth.connected()) return renderSetup(); }
  renderMini(); markPlaying();
}
// smooth the progress bar between polls
setInterval(() => {
  const p = S.player; if (!p || !p.is_playing || !p.duration) return;
  const bar = document.querySelector(".mini .bar i"); if (!bar) return;
  const now = Math.min(p.duration, p.progress + (Date.now() - p.at));
  bar.style.width = (now / p.duration * 100) + "%";
}, 1000);

async function loadLibrary(force) {
  const cached = LS.get("lib");
  if (!S.demo && cached && !force) {
    S.albums = cached.albums; S.playlists = cached.playlists; renderRack();
    if (Date.now() - cached.t < 30 * 60000) return;
  }
  try {
    const lib = await Src().library();
    S.albums = lib.albums; S.playlists = lib.playlists;
    if (!S.demo) LS.set("lib", { t: Date.now(), ...lib });
    renderRack();
    if (force) toast(`Rack restocked: ${S.albums.length} CDs, ${S.playlists.length} mixtapes`);
  } catch (e) {
    if (e.status === 401 && !Auth.connected()) return renderSetup();
    toast(errText(e), 6000);
    if (!S.albums.length) $("#rack").replaceChildren(h("div", { class: "empty" }, "Couldn't load your library: " + errText(e)));
  }
}

function menu() {
  sheet(h("div", null,
    h("h2", { style: "margin-top:0" }, "CD Rack"),
    h("div", { class: "btns", style: "flex-direction:column;align-items:stretch" },
      h("button", { class: "btn", onclick: () => { closeSheet(); loadLibrary(true); } }, "↻  Reload my library"),
      h("button", { class: "btn", onclick: () => { S.device = null; LS.del("device"); closeSheet(); toast("Will ask which device next time"); } }, "Change playback device"),
      S.demo ? h("button", { class: "btn primary", onclick: () => { S.demo = false; LS.set("demo", false); closeSheet(); boot(); } }, "Leave demo, set up Spotify")
             : h("button", { class: "btn", onclick: () => { Auth.logout(); closeSheet(); boot(); } }, "Log out / Reconnect"),
      h("button", { class: "btn", onclick: closeSheet }, "Close"))));
}

function renderShell() {
  const app = $("#app"); app.textContent = "";
  const search = h("input", { class: "search", type: "search", placeholder: "Find a CD…", value: S.filter,
    oninput: (e) => { S.filter = e.target.value; renderRack(); } });
  const tab = (key, label) => h("button", { class: S.tab === key ? "on" : "", onclick: () => { S.tab = key; LS.set("tab", key); renderShell(); } }, label);
  app.append(
    h("header", null,
      h("div", { class: "row", style: "justify-content:space-between" },
        h("h1", null, "CD RACK", S.demo ? h("small", null, "demo") : null),
        h("button", { class: "icon", "aria-label": "Menu", onclick: menu }, "☰")),
      h("div", { class: "row" },
        h("div", { class: "tabs row" }, tab("albums", "Albums"), tab("playlists", "Mixtapes")),
        h("button", { class: "chip", onclick: luckyDip }, "🎲")),
      h("div", { class: "row", style: "margin-top:8px" }, search),
      h("div", { class: "az", id: "az" })),
    h("main", { class: "rack", id: "rack" }),
    h("div", { class: "mini", id: "mini" }));
  renderRack(); renderMini();
}
function luckyDip() {
  const items = currentItems(); if (!items.length) return;
  openCase(items[Math.floor(Math.random() * items.length)]);
}

function renderSetup(msg) {
  const app = $("#app"); app.textContent = "";
  const idInput = h("input", { type: "text", placeholder: "Paste your Spotify Client ID", value: S.clientId, autocapitalize: "off", autocomplete: "off", spellcheck: "false" });
  const copyBtn = h("button", { class: "btn", onclick: async () => { try { await navigator.clipboard.writeText(REDIRECT); toast("Copied"); } catch { toast("Press and hold the address to copy it"); } } }, "Copy");
  app.append(h("div", { class: "setup" },
    h("h1", null, "CD RACK"),
    msg ? h("p", { style: "color:#e8b04a" }, msg) : null,
    h("p", null, "Your Spotify albums as CDs on a shelf. Tap one, and it plays on your phone."),
    h("p", null, h("b", null, "1. "), "In your Spotify developer app, set the Redirect URI to exactly:"),
    h("p", null, h("code", null, REDIRECT), " ", copyBtn),
    h("p", null, h("b", null, "2. "), "Paste the app's Client ID here:"),
    idInput,
    h("div", { class: "btns" },
      h("button", { class: "btn primary", onclick: () => {
        const v = idInput.value.trim();
        if (!/^[0-9a-f]{32}$/i.test(v)) return toast("That doesn't look like a Client ID (32 letters and numbers)", 4000);
        S.clientId = v; LS.set("clientId", v); Auth.login();
      } }, "Connect Spotify"),
      h("button", { class: "btn", onclick: () => { S.demo = true; LS.set("demo", true); boot(); } }, "Try the demo")),
    location.protocol !== "https:" && location.hostname !== "127.0.0.1"
      ? h("p", { class: "by", style: "color:#e8b04a" }, "Note: this page must be opened over https:// (e.g. GitHub Pages) for Spotify login to work.") : null,
    h("p", { class: "by", style: "font-size:13px;margin-top:24px" }, "Your login stays on this phone. Nothing is sent anywhere except Spotify.")));
}

let pollTimer = null;
async function boot() {
  try {
    if (!S.demo && await Auth.handleRedirect()) toast("Connected to Spotify");
  } catch (e) { return renderSetup(e.message); }
  if (!S.demo && (!S.clientId || !Auth.connected())) return renderSetup();
  renderShell();
  await Promise.all([loadLibrary(false), refreshPlayer()]);
  markPlaying();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === "visible") refreshPlayer(); }, 8000);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (S.demo || Auth.connected())) refreshPlayer(); });
boot();
</script>
</body>
</html>
